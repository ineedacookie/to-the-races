{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18212b">
    <title>Live Race · To The Races</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    <link rel="stylesheet" href="{% static 'css/display.css' %}">
    <script type="module" src="{% static 'dist/display.js' %}"></script>
  </head>
  <body class="display-body">
    <main class="display-stage">
      <div id="game-canvas" class="game-canvas" aria-label="Live fantasy race animation"></div>

      <header class="race-hud">
        <div class="race-hud__brand">
          <span class="mini-flag" aria-hidden="true"></span>
          <span>
            <small id="display-round">Next round</small>
            <strong>To The Races</strong>
          </span>
        </div>
        <div class="race-hud__phase">
          <small id="display-connection" data-status="connecting">Connecting</small>
          <strong id="display-phase">Preparing the track</strong>
        </div>
        <div class="race-hud__stat">
          <small>Clock</small>
          <strong id="display-countdown">—</strong>
        </div>
        <div class="race-hud__stat">
          <small id="display-pot-label">Crowd pot</small>
          <strong id="display-pot">$0</strong>
        </div>
      </header>

      <aside id="grandstand" class="grandstand" aria-label="Spectator grandstand">
        <p class="grandstand__title">The Crooked Grandstand</p>
        <ol id="grandstand-seats" class="grandstand__seats"></ol>
      </aside>

      <aside id="join-card" class="join-card">
        <img src="{% url 'betting-qr' %}" alt="QR code for the betting sheet">
        <div>
          <small>Join on your phone</small>
          <strong>Scan to bet</strong>
          <span>{{ bet_url }}</span>
        </div>
      </aside>

      <section id="event-card" class="event-card" hidden aria-live="polite">
        <span>Track report</span>
        <strong id="event-text"></strong>
      </section>

      <div id="reaction-layer" class="reaction-layer" aria-live="polite" aria-relevant="additions"></div>

      <section id="display-results" class="display-results" hidden aria-live="polite">
        <p>Official result</p>
        <h1 id="display-results-title">Result</h1>
        <ol id="display-results-list"></ol>
        <div id="display-boards-snippet" class="display-boards-snippet" hidden>
          <div>
            <small>Hall of Fame</small>
            <ol id="display-leader-snippet"></ol>
          </div>
          <div>
            <small>Oops Ledger</small>
            <ol id="display-debt-snippet"></ol>
          </div>
        </div>
      </section>

      <div class="display-controls">
        <button id="mute-button" type="button" aria-pressed="false">Sound on</button>
        <button id="fullscreen-button" type="button">Fullscreen</button>
      </div>
    </main>
  </body>
</html>
